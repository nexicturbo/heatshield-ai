name: Native Arm64 inference benchmark

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/arm64-inference-benchmark.yml"
      - "model/arm_optimization/**"
      - "model/artifacts/heatshield-model.joblib"
      - "model/requirements.txt"

permissions:
  contents: read

jobs:
  benchmark:
    name: HeatShield before/after on native Arm64
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
      VECLIB_MAXIMUM_THREADS: "1"
      OMP_DYNAMIC: "FALSE"
      PYTHONHASHSEED: "0"

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            model/requirements.txt
            model/arm_optimization/requirements.txt

      - name: Install pinned runtime
        run: python -m pip install -r model/arm_optimization/requirements.txt

      - name: Verify native architecture
        run: |
          python - <<'PY'
          import platform
          machine = platform.machine().lower().replace("_", "")
          print(f"platform.machine()={machine}")
          if machine not in {"aarch64", "arm64"}:
              raise SystemExit("This benchmark requires a native Arm64 runner")
          PY

      - name: Run optimization unit tests
        run: python -m unittest discover -s model/arm_optimization/tests -v

      - name: Export complete model bundle to ONNX
        run: python model/arm_optimization/export_models.py

      - name: Validate scikit-learn to ONNX parity
        run: |
          python model/arm_optimization/validate_parity.py \
            --output benchmark-results/parity.json

      - name: Benchmark joblib baseline
        run: |
          python model/arm_optimization/benchmark.py \
            --engine baseline \
            --output benchmark-results/baseline.json \
            --batch-sizes 256 \
            --warmup 10 \
            --iterations 100 \
            --threads 1 \
            --require-native-arm \
            --require-controlled-threads

      - name: Benchmark ONNX Runtime candidate
        run: |
          python model/arm_optimization/benchmark.py \
            --engine candidate \
            --output benchmark-results/candidate.json \
            --batch-sizes 256 \
            --warmup 10 \
            --iterations 100 \
            --threads 1 \
            --require-native-arm \
            --require-controlled-threads

      - name: Evaluate evidence gate
        run: |
          python model/arm_optimization/compare_benchmarks.py \
            --baseline benchmark-results/baseline.json \
            --candidate benchmark-results/candidate.json \
            --parity benchmark-results/parity.json \
            --output benchmark-results/comparison.json \
            --primary-batch 256 \
            --minimum-speedup 1.20 \
            --require-native-arm \
            --enforce-gate

      - name: Publish benchmark summary
        if: always()
        run: |
          if [ -f benchmark-results/comparison.json ]; then
            python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          result = json.loads(Path("benchmark-results/comparison.json").read_text())
          print("## HeatShield native Arm64 evidence gate")
          print()
          print(f"- Runtime parity: **{result['parity_passed']}**")
          print(f"- Native Arm evidence: **{result['native_arm_evidence']}**")
          print(
              "- Official GitHub provenance: "
              f"**{result['official_github_evidence']}**"
          )
          print(f"- Primary speedup gate: **{result['primary_speedup_passed']}**")
          print(
              "- Batch-256 median speedup: "
              f"**{result['batches']['256']['median_latency_speedup']:.3f}x**"
          )
          print(f"- Performance claim allowed: **{result['performance_claim_allowed']}**")
          print()
          print("No speedup should be claimed unless the final value is true.")
          PY
          fi

      - name: Record immutable evidence checksums
        if: always()
        run: |
          mkdir -p benchmark-results
          python -m pip freeze --all > benchmark-results/python-environment.txt
          evidence_paths=(benchmark-results)
          if [ -d model/artifacts/arm_onnx ]; then
            evidence_paths+=(model/artifacts/arm_onnx)
          fi
          find "${evidence_paths[@]}" -type f \
            ! -name SHA256SUMS.txt -print0 \
            | sort -z \
            | xargs -0 sha256sum > /tmp/heatshield-SHA256SUMS.txt
          mv /tmp/heatshield-SHA256SUMS.txt benchmark-results/SHA256SUMS.txt

      - name: Upload reproducible evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: heatshield-native-arm64-evidence
          path: |
            benchmark-results/
            model/artifacts/arm_onnx/
          if-no-files-found: error
          retention-days: 90

